<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="'Courier New', monospace" font-size="13">
  <style>
    .title { font-size: 20px; font-weight: bold; fill: #1a1a2e; }
    .subtitle { font-size: 12px; fill: #555; }
    .layer-label { font-size: 12px; font-weight: bold; fill: #1a1a2e; }
    .dim-label { font-size: 11px; fill: #0066cc; }
    .box { fill: #e8f4f8; stroke: #333; stroke-width: 1.5; rx: 4; }
    .box-attn { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; rx: 4; }
    .box-mlp { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; rx: 4; }
    .box-out { fill: #fce4ec; stroke: #c62828; stroke-width: 1.5; rx: 4; }
    .box-emb { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1.5; rx: 4; }
    .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-dim { stroke: none; fill: #0066cc; font-size: 10px; }
    .param { font-size: 10px; fill: #b71c1c; font-style: italic; }
    .note { font-size: 10px; fill: #666; }
    .section-bg { fill: #fafafa; stroke: #ddd; stroke-width: 1; rx: 6; opacity: 0.5; }
    .section-title { font-size: 13px; font-weight: bold; fill: #333; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" class="title">1-Layer Transformer — Data Flow with Dimensions</text>
  <text x="550" y="48" text-anchor="middle" class="subtitle">B=6 (batch), T=6 (seq len), D=32 (d_model), M=64 (d_mlp), V=15 (vocab)</text>

  <!-- ==================== INPUT SECTION ==================== -->
  <rect x="50" y="65" width="1000" height="50" class="section-bg"/>
  <text x="550" y="72" text-anchor="middle" class="section-title">📥 INPUT</text>

  <!-- Token IDs -->
  <rect x="80" y="95" width="140" height="35" class="box-emb" stroke-width="2"/>
  <text x="150" y="117" text-anchor="middle" class="layer-label">Token IDs</text>
  <text x="150" y="130" text-anchor="middle" class="dim-label">[B, T] = [6, 6]</text>
  <text x="150" y="145" text-anchor="middle" class="note">e.g. [10,11,12,2,13,14]</text>

  <!-- ==================== EMBEDDING SECTION ==================== -->
  <rect x="50" y="170" width="1000" height="100" class="section-bg"/>
  <text x="550" y="177" text-anchor="middle" class="section-title">🔤 EMBEDDING LAYER</text>

  <!-- Token Embedding -->
  <rect x="80" y="200" width="160" height="40" class="box-emb" stroke-width="2"/>
  <text x="160" y="220" text-anchor="middle" class="layer-label">tok_emb lookup</text>
  <text x="160" y="255" text-anchor="middle" class="dim-label">W_tok: [V, D] = [15, 32]</text>

  <!-- Pos Embedding -->
  <rect x="340" y="200" width="160" height="40" class="box-emb" stroke-width="2"/>
  <text x="420" y="220" text-anchor="middle" class="layer-label">pos_emb lookup</text>
  <text x="420" y="255" text-anchor="middle" class="dim-label">W_pos: [T, D] = [6, 32]</text>

  <!-- Addition -->
  <text x="600" y="225" text-anchor="middle" class="param">+</text>

  <!-- x (residual stream) -->
  <rect x="700" y="195" width="180" height="50" class="box" stroke-width="2"/>
  <text x="790" y="217" text-anchor="middle" class="layer-label">x (Residual Stream)</text>
  <text x="790" y="240" text-anchor="middle" class="dim-label">[B, T, D] = [6, 6, 32]</text>

  <!-- Input arrow -->
  <line x1="220" y1="220" x2="340" y2="220" class="arrow"/>
  <text x="280" y="212" text-anchor="middle" class="arrow-dim">[6,6]→[6,32]</text>
  <line x1="500" y1="220" x2="600" y2="220" class="arrow"/>
  <line x1="600" y1="220" x2="700" y2="220" class="arrow" stroke-dasharray="4,2"/>

  <!-- ==================== ATTENTION SECTION ==================== -->
  <rect x="50" y="300" width="1000" height="240" class="section-bg" fill="#fff8f0"/>
  <text x="550" y="307" text-anchor="middle" class="section-title" fill="#e65100">🔶 SELF-ATTENTION SUB-LAYER</text>

  <!-- Q projection -->
  <rect x="80" y="335" width="140" height="40" class="box-attn"/>
  <text x="150" y="357" text-anchor="middle" class="layer-label">Q = x @ Wq</text>
  <text x="150" y="390" text-anchor="middle" class="dim-label">[6,6,32] @ [32,32] → [6,6,32]</text>

  <!-- K projection -->
  <rect x="280" y="335" width="140" height="40" class="box-attn"/>
  <text x="350" y="357" text-anchor="middle" class="layer-label">K = x @ Wk</text>
  <text x="350" y="390" text-anchor="middle" class="dim-label">[6,6,32] @ [32,32] → [6,6,32]</text>

  <!-- V projection -->
  <rect x="480" y="335" width="140" height="40" class="box-attn"/>
  <text x="550" y="357" text-anchor="middle" class="layer-label">V = x @ Wv</text>
  <text x="550" y="390" text-anchor="middle" class="dim-label">[6,6,32] @ [32,32] → [6,6,32]</text>

  <!-- Attention scores -->
  <rect x="320" y="405" width="220" height="40" class="box-attn" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="430" y="427" text-anchor="middle" class="layer-label">attn_scores</text>
  <text x="430" y="450" text-anchor="middle" class="dim-label">Q @ Kᵀ / √d → [6,6,6]    [B, query_pos, key_pos]</text>

  <!-- Causal mask -->
  <rect x="600" y="405" width="160" height="40" class="box-attn"/>
  <text x="680" y="427" text-anchor="middle" class="layer-label">causal mask</text>
  <text x="680" y="450" text-anchor="middle" class="dim-label">triu → [6,6,6]</text>

  <!-- Softmax -->
  <rect x="400" y="475" width="200" height="35" class="box-attn" stroke-width="2"/>
  <text x="500" y="497" text-anchor="middle" class="layer-label">softmax → attn_weights</text>
  <text x="500" y="518" text-anchor="middle" class="dim-label">[6, 6, 6]  rows sum to 1</text>

  <!-- Weighted sum -->
  <rect x="320" y="540" width="140" height="40" class="box-attn"/>
  <text x="390" y="562" text-anchor="middle" class="layer-label">attn @ V</text>
  <text x="390" y="595" text-anchor="middle" class="dim-label">[6,6,6] @ [6,6,32] → [6,6,32]</text>

  <!-- WO projection -->
  <rect x="540" y="540" width="140" height="40" class="box-attn"/>
  <text x="610" y="562" text-anchor="middle" class="layer-label">@ WO</text>
  <text x="610" y="595" text-anchor="middle" class="dim-label">[6,6,32] @ [32,32] → [6,6,32]</text>

  <!-- attn_out -->
  <rect x="760" y="540" width="140" height="40" class="box-attn"/>
  <text x="830" y="562" text-anchor="middle" class="layer-label">attn_out</text>
  <text x="830" y="595" text-anchor="middle" class="dim-label">[B, T, D] = [6, 6, 32]</text>

  <!-- Arrows in attention -->
  <line x1="150" y1="375" x2="380" y2="405" class="arrow"/>
  <line x1="350" y1="375" x2="430" y2="405" class="arrow"/>
  <line x1="550" y1="375" x2="430" y2="445" class="arrow"/>
  <line x1="430" y1="445" x2="490" y2="475" class="arrow"/>
  <line x1="680" y1="445" x2="490" y2="475" class="arrow"/>
  <line x1="490" y1="510" x2="390" y2="540" class="arrow"/>
  <line x1="490" y1="510" x2="410" y2="540" class="arrow"/>
  <line x1="550" y1="560" x2="760" y2="560" class="arrow"/>

  <!-- Residual connection (attn out) -->
  <line x1="830" y1="580" x2="830" y2="620" class="arrow" stroke="green" stroke-width="2"/>
  <text x="830" y="615" text-anchor="middle" class="param" fill="green">residual + → x1</text>

  <!-- ==================== MLP SECTION ==================== -->
  <rect x="50" y="605" width="1000" height="180" class="section-bg" fill="#f0fff0"/>
  <text x="550" y="612" text-anchor="middle" class="section-title" fill="#2e7d32">🟢 MLP SUB-LAYER</text>

  <!-- x1 -->
  <rect x="80" y="640" width="140" height="40" class="box"/>
  <text x="150" y="662" text-anchor="middle" class="layer-label">x1 (in)</text>
  <text x="150" y="685" text-anchor="middle" class="dim-label">[B, T, D] = [6, 6, 32]</text>

  <!-- W1 expansion -->
  <rect x="280" y="640" width="140" height="40" class="box-mlp"/>
  <text x="350" y="662" text-anchor="middle" class="layer-label">@ W1 + b1</text>
  <text x="350" y="695" text-anchor="middle" class="dim-label">[32, 64] expand!</text>

  <!-- h_pre -->
  <rect x="480" y="640" width="120" height="40" class="box-mlp"/>
  <text x="540" y="662" text-anchor="middle" class="layer-label">h_pre</text>
  <text x="540" y="695" text-anchor="middle" class="dim-label">[B, T, M]</text>
  <text x="540" y="710" text-anchor="middle" class="dim-label">[6, 6, 64]</text>

  <!-- GELU -->
  <rect x="680" y="640" width="100" height="40" class="box-mlp" stroke-dasharray="5,3"/>
  <text x="730" y="662" text-anchor="middle" class="layer-label">GELU</text>
  <text x="730" y="695" text-anchor="middle" class="dim-label">non-linear</text>

  <!-- W2 contraction -->
  <rect x="840" y="640" width="120" height="40" class="box-mlp"/>
  <text x="900" y="655" text-anchor="middle" class="layer-label">@ W2 + b2</text>
  <text x="900" y="673" text-anchor="middle" class="dim-label">[64, 32]</text>
  <text x="900" y="688" text-anchor="middle" class="dim-label">contract!</text>

  <!-- mlp_out -->
  <rect x="840" y="715" width="120" height="30" class="box-mlp"/>
  <text x="900" y="735" text-anchor="middle" class="dim-label">mlp_out [6,6,32]</text>

  <!-- Residual + -->
  <text x="630" y="730" text-anchor="middle" class="param" fill="green">+ → x2</text>

  <!-- MLP arrows -->
  <line x1="220" y1="660" x2="280" y2="660" class="arrow"/>
  <line x1="420" y1="660" x2="480" y2="660" class="arrow"/>
  <line x1="600" y1="660" x2="680" y2="660" class="arrow"/>
  <line x1="780" y1="660" x2="840" y2="660" class="arrow"/>
  <line x1="900" y1="715" x2="900" y2="690" class="arrow" stroke="green" stroke-width="2"/>

  <!-- ==================== OUTPUT SECTION ==================== -->
  <rect x="50" y="780" width="1000" height="130" class="section-bg" fill="#fff0f0"/>
  <text x="550" y="787" text-anchor="middle" class="section-title" fill="#c62828">🔴 OUTPUT</text>

  <!-- Unembedding -->
  <rect x="80" y="815" width="180" height="40" class="box-out"/>
  <text x="170" y="837" text-anchor="middle" class="layer-label">x2 @ W_U + b_U</text>
  <text x="170" y="865" text-anchor="middle" class="dim-label">W_U: [D, V] = [32, 15]</text>

  <!-- Logits -->
  <rect x="340" y="815" width="180" height="40" class="box-out"/>
  <text x="430" y="837" text-anchor="middle" class="layer-label">logits</text>
  <text x="430" y="860" text-anchor="middle" class="dim-label">[B, T, V] = [6, 6, 15]</text>

  <!-- Slice last -->
  <rect x="600" y="815" width="180" height="40" class="box-out"/>
  <text x="690" y="837" text-anchor="middle" class="layer-label">logits_last [:, -1, :]</text>
  <text x="690" y="860" text-anchor="middle" class="dim-label">[B, V] = [6, 15]</text>

  <!-- Softmax probs -->
  <rect x="860" y="815" width="160" height="40" class="box-out"/>
  <text x="940" y="837" text-anchor="middle" class="layer-label">softmax → probs</text>
  <text x="940" y="860" text-anchor="middle" class="dim-label">[B, V] = [6, 15]</text>

  <!-- Output arrows -->
  <line x1="260" y1="835" x2="340" y2="835" class="arrow"/>
  <line x1="520" y1="835" x2="600" y2="835" class="arrow"/>
  <line x1="780" y1="835" x2="860" y2="835" class="arrow"/>

  <!-- x2 from MLP -->
  <line x1="900" y1="745" x2="900" y2="790" class="arrow" stroke-dasharray="3,2"/>
  <text x="900" y="788" text-anchor="middle" class="param" fill="#c62828">"___" position only</text>

  <!-- Legend -->
  <rect x="50" y="890" width="1000" height="25" class="section-bg"/>
  <text x="100" y="907" class="dim-label">🔴 = Output layer  |  🔶 = Attention  |  🟢 = MLP  |  🟣 = Embedding  |  D=32  |  M=64  |  V=15</text>
</svg>